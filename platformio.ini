; Historical ESP-AI / ESP32-S3 project archive.
; Dependencies below are a reconstruction from bundled library names (NOT a verified build lockfile).
; The original ZIP bundled duplicate esp-ai variants and missing upstream pin information.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_ESP32_S3R8N16 -DBOARD_HAS_PSRAM -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1
board_upload.flash_size = 16MB
monitor_filters = esp32_exception_decoder
build_type = debug

; These are the best-effort declared dependencies; unverified for the original toolchain.
; ESP-AI client 2.84.43/2.86.49 and modified esp32-eyes may still require pinned
; upstream release ZIPs or a small permission-cleared local library override.
lib_deps =
    bblanchon/ArduinoJson@^6.21.2
    arduino-libraries/NTPClient@^3.2.1
    madhephaestus/ESP32Servo@^3.0.6
    arduino-libraries/ArduinoMqttClient@^0.1.8
    mathertel/OneButton@^1.5.0
    links2004/WebSockets@^2.4.0
    adafruit/Adafruit NeoPixel@^1.12.3
    olikraus/U8g2@^2.35.30
    bodmer/TFT_eSPI@^2.5.43
    bodmer/U8g2_for_TFT_eSPI@^1.7.0
    bodmer/TJpg_Decoder@^1.1.0
    https://github.com/playfultechnology/esp32-eyes.git
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.0.1
    https://github.com/pschatzmann/arduino-libhelix.git
    https://github.com/pschatzmann/arduino-liblame.git

; Not auto-resolved by the original config; ESP-AI hardware client is distributed
; through release assets, not necessarily as a PlatformIO installable repo root.
; https://github.com/wangzongming/esp-ai/releases
; Restore a compatible client version (see docs/dependencies.md) before compiling.
